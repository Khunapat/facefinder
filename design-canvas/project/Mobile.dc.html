          </div>
          <input type="text" aria-label="Name" value="Nan" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #dddddd; border-radius: 8px; background: #ffffff; color: #222222; font-family: inherit; font-size: 14px">
          <div style="font-size: 13px; color: #6a6a6a">38 photos</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="position: relative">
            <button type="button" aria-label="Check this person's photos" style="display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 14px; background: #f2f2f2; color: #c1c1c1"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg></button>
            <button type="button" aria-pressed="false" aria-label="Make a folder for this person" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 9999px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.85)"></span></button>
          </div>
          <input type="text" aria-label="Name" placeholder="Name" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #dddddd; border-radius: 8px; background: #ffffff; color: #222222; font-family: inherit; font-size: 14px">
          <div style="font-size: 13px; color: #6a6a6a">31 photos</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="position: relative">
            <button type="button" aria-label="Check this person's photos" style="display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 14px; background: #f2f2f2; color: #c1c1c1"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg></button>
            <button type="button" aria-pressed="false" aria-label="Make a folder for this person" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 9999px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.85)"></span></button>
          </div>
          <input type="text" aria-label="Name" placeholder="Name" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #dddddd; border-radius: 8px; background: #ffffff; color: #222222; font-family: inherit; font-size: 14px">
          <div style="font-size: 13px; color: #6a6a6a">27 photos</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="position: relative">
            <button type="button" aria-label="Check this person's photos" style="display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 14px; background: #f2f2f2; color: #c1c1c1"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg></button>
            <button type="button" aria-pressed="true" aria-label="Make a folder for this person" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: grid; place-items: center"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 9999px; display: grid; place-items: center; background: {{accent}}; border: 1.5px solid {{accent}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
          </div>
          <input type="text" aria-label="Name" value="Fah" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #dddddd; border-radius: 8px; background: #ffffff; color: #222222; font-family: inherit; font-size: 14px">
          <div style="font-size: 13px; color: #6a6a6a">24 photos</div>
        </div>

      </div>
    </section>
  </div>

  <div style="flex: 0 0 auto; padding: 12px 16px; background: #ffffff; border-top: 1px solid #dddddd; box-shadow: rgba(0,0,0,0.06) 0 -2px 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center">

</div>
</x-dc>
