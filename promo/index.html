<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FaceFinder promo</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Noto+Sans+Thai:wght@500;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#1f2540}
canvas{display:block;height:100vh;width:auto;margin:0 auto}
body.render canvas{height:auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib/cast.js"></script>
<script src="lib/photos.js"></script>
<script src="timeline.js"></script>
<script>
// A 20-second promo for FaceFinder, as a pure function of time:
// window.seek(t) paints frame t. No timers, no carried state, no Math.random.

const { W, H, DUR } = TL;
const cv = document.getElementById('c'), g = cv.getContext('2d');

// The app's own tokens (app/static/index.html)
const INK = '#1f2540', PAGE = '#fdf0f5', PAPER = '#FFFFFF', ACCENT = '#d6336c',
      ACCENT_DEEP = '#b9255a', SOFT = '#f6dbe6', MUTED = '#5b6178';
const DISPLAY = 'Mitr, "Noto Sans Thai", sans-serif';
const UI = '"Noto Sans Thai", sans-serif';

// ------------------------------------------------------------- motion kit
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const smooth = (u) => u * u * (3 - 2 * u);

// Closed-form damped spring 0 -> 1.
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
// A value with several targets: one spring per change, summed.
function track(t, keys, k = 170, d = 26) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], k, d);
  return v;
}
const SNAPPY = [320, 30], SOFTS = [170, 26], HEAVY = [120, 24], BOUNCY = [260, 16];

function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function shadow(blur, dy, a) {
  g.shadowColor = `rgba(31,37,64,${a})`; g.shadowBlur = blur; g.shadowOffsetY = dy;
}
function noShadow() { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }

// ----------------------------------------------------------------- assets
const IMG = {};
const UI_NAMES = ['chip', 'tabs_everyone', 'tabs_cull', 'tabs_sort', 'preview_0', 'preview_1', 'cull_0', 'cull_1',
  'sortres', 'sortmsg', 'bar_0', 'done',
  ...Array.from({ length: 9 }, (_, i) => 'scan_' + i),
  ...Array.from({ length: 5 }, (_, i) => 'everyone_' + i),
  ...Array.from({ length: 6 }, (_, i) => 'sortform_' + i),
  ...Array.from({ length: 5 }, (_, i) => 'copy_' + i)];
const MASCOTS = ['cam-wave', 'cam-search', 'cam-celebrate'];
let SPOTS = null;

// The wall of camp photos for the hook: 4:3 tiles, drawn once.
const TW = 340, TH = 255, TG = 16, TCOLS = 3, TX0 = (W - (TW * TCOLS + TG * 2)) / 2;
const wall = [];

const load = (key, src) => new Promise((res, rej) => {
  const im = new Image(); im.onload = res; im.onerror = () => rej(src); im.src = src; IMG[key] = im;
});
window.ready = (async () => {
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('canvas'); c.width = TW * 2; c.height = TH * 2;
    Photos.draw(c.getContext('2d'), c.width, c.height, 'w-' + i); wall.push(c);
  }
  await Promise.all([
    ...UI_NAMES.map((n) => load(n, 'assets/ui/' + n + '.png')),
    ...MASCOTS.map((n) => load(n, '../design-canvas/assets/' + n + '.png')),
  ]);
  SPOTS = window.UI_MANIFEST.spots;
  for (const f of ['600 100px Mitr', '500 100px Mitr', '500 40px "Noto Sans Thai"', '600 40px "Noto Sans Thai"', '700 40px "Noto Sans Thai"'])
    await document.fonts.load(f);
  return true;
})();

// ------------------------------------------------------------ type helpers
// Words rise in on a stagger behind a clip, and leave upward.
function words(lines, x, y, size, t, tIn, tOut, color, opt = {}) {
  const lh = size * (opt.lh || 1.08);
  g.font = `${opt.weight || 600} ${size}px ${opt.font || DISPLAY}`;
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  if ('letterSpacing' in g) g.letterSpacing = (opt.track ?? -0.02) * size + 'px';
  let i = 0;
  lines.forEach((line, li) => {
    let cx = x;
    const parts = line.split(' ');
    parts.forEach((wd, wi) => {
      const ws = wd + (wi < parts.length - 1 ? ' ' : '');
      const w = g.measureText(ws).width;
      const s = spring(t - tIn - i * 0.06, ...SNAPPY);
      const out = tOut == null ? 0 : smooth(inv(tOut, tOut + 0.22, t + (lines.length * 2 - i) * 0.012));
      const a = clamp(s * 1.6) * (1 - out) * (opt.alpha ?? 1);
      if (a > 0.001) {
        const dy = (1 - s) * size * 0.6 - out * size * 0.55;
        g.save();
        g.beginPath(); g.rect(cx - 10, y + li * lh - size * 1.05, w + 40, size * 1.45); g.clip();
        g.globalAlpha = a; g.fillStyle = (opt.accent || []).includes(wd) ? (opt.accentColor || ACCENT) : color;
        g.fillText(ws, cx, y + li * lh + dy);
        g.restore();
      }
      cx += w; i++;
    });
  });
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}

// A UI screenshot. Image px -> screen with scale s; optional source crop.
function ui(im, x, y, s, r, opt = {}) {
  const sy = opt.sy || 0, sh = opt.sh ?? (im.height - sy);
  const w = im.width * s, h = sh * s;
  g.save();
  if (opt.shadow !== false) { shadow(60, 24, 0.12); rrect(x, y, w, h, r); g.fillStyle = PAPER; g.fill(); noShadow(); }
  rrect(x, y, w, h, r); g.clip();
  g.drawImage(im, 0, sy, im.width, sh, x, y, w, h);
  g.restore();
  return { x, y, w, h, s };
}

// A fingertip: a soft disc that presses on tap, with a pink ripple.
function finger(x, y, tTap, t, alpha = 1) {
  if (alpha <= 0) return;
  const p = t - tTap;
  const press = p > -0.08 && p < 0.16 ? Math.sin(clamp((p + 0.08) / 0.24) * Math.PI) : 0;
  g.save(); g.globalAlpha = alpha;
  if (p > 0 && p < 0.6) {
    const u = p / 0.6;
    g.strokeStyle = `rgba(214,51,108,${0.55 * (1 - u)})`; g.lineWidth = 7;
    g.beginPath(); g.arc(x, y, 40 + u * 90, 0, Math.PI * 2); g.stroke();
  }
  shadow(24, 8, 0.25);
  g.fillStyle = 'rgba(255,255,255,0.94)';
  g.beginPath(); g.arc(x, y, 44 * (1 - 0.18 * press), 0, Math.PI * 2); g.fill();
  noShadow();
  g.strokeStyle = 'rgba(31,37,64,0.35)'; g.lineWidth = 4; g.stroke();
  g.fillStyle = `rgba(31,37,64,${0.18 + 0.3 * press})`;
  g.beginPath(); g.arc(x, y, 16, 0, Math.PI * 2); g.fill();
  g.restore();
}
// A finger that glides in from below-right, taps, and leaves.
function tapAt(x, y, tTap, t) {
  const a = smooth(inv(tTap - 0.55, tTap - 0.25, t)) * (1 - smooth(inv(tTap + 0.3, tTap + 0.55, t)));
  if (a > 0) finger(x + (1 - a) * 150, y + 18 + (1 - a) * 240, tTap, t, a);
}

// The FaceFinder mark (same paths as the app's nav icon) and wordmark.
function mark(x, y, size, ring) {
  const s = size / 24;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.lineCap = 'round'; g.strokeStyle = ring; g.fillStyle = ring; g.lineWidth = 2.2;
  g.beginPath(); g.arc(10.5, 10.5, 7, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(15.8, 15.8); g.lineTo(21, 21); g.stroke();
  g.beginPath(); g.arc(8, 9.2, 1, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(13, 9.2, 1, 0, Math.PI * 2); g.fill();
  g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(8, 12.6); g.bezierCurveTo(9.5, 13.9, 11.5, 13.9, 13, 12.6); g.stroke();
  g.restore();
}
function wordmark(cx, y, size, color) {
  g.font = `600 ${size}px ${DISPLAY}`; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  if ('letterSpacing' in g) g.letterSpacing = (-0.01 * size) + 'px';
  const w = g.measureText('FaceFinder').width, m = size * 0.95, gap = size * 0.25;
  const x0 = cx - (w + m + gap) / 2;
  g.fillStyle = PAPER; shadow(30, 10, 0.08);
  g.beginPath(); g.arc(x0 + m / 2, y - size * 0.36, m / 2, 0, Math.PI * 2); g.fill(); noShadow();
  mark(x0 + m * 0.2, y - size * 0.36 - m * 0.3, m * 0.6, ACCENT);
  g.fillStyle = color; g.fillText('FaceFinder', x0 + m + gap, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}

// The camera mascot, springing in with a squash and a gentle bob after.
function mascot(name, cx, cy, size, t, tIn, opt = {}) {
  const s = spring(t - tIn, ...BOUNCY);
  if (s <= 0.001) return;
  const bob = opt.bob === false ? 0 : Math.sin((t - tIn) * Math.PI * 2 / 2.4) * size * 0.025 * clamp(t - tIn - 0.3);
  const sq = 1 + (1 - s) * 0.25;
  g.save(); g.globalAlpha = clamp(s * 3);
  g.translate(cx, cy + (1 - s) * size * 0.4 + bob);
  g.scale(s / sq * (opt.flip ? -1 : 1), s * sq);
  if (opt.tilt) g.rotate(opt.tilt);
  g.drawImage(IMG[name], -size / 2, -size / 2, size, size);
  g.restore();
}

// ================================================================== SHOTS
// shared frame for the app shots: page-pink, caption on top, UI below
const S = 1000 / 1029, PX = (W - 1029 * S) / 2;
const CAP_Y = 250, APP_Y = 470;
function caption(t, lines, tIn, tOut, accent) {
  words(lines, 64, CAP_Y, 100, t, tIn, tOut, INK, { accent });
}

// 0-3 s: the wall of photos. "800 camp photos." "Now sort them."
function drawHook(t) {
  g.fillStyle = INK; g.fillRect(0, 0, W, H);
  // The wall streams up fast, slows, then speeds again into the reveal.
  const off = 2200 * (1 - Math.exp(-t / 0.7)) + 900 * Math.pow(inv(TL.zoom - 0.5, TL.reveal + 0.4, t), 2.2);
  const step = TH + TG;
  const r0 = Math.floor(off / step) - 1;
  for (let r = r0; r < r0 + Math.ceil(H / step) + 2; r++) for (let c = 0; c < TCOLS; c++) {
    const x = TX0 + c * (TW + TG) + (r % 2 ? 0 : 0), y = r * step - off + 60;
    const tile = wall[((r * TCOLS + c) % wall.length + wall.length) % wall.length];
    g.save(); rrect(x, y, TW, TH, 22); g.clip();
    g.drawImage(tile, x, y, TW, TH);
    g.fillStyle = 'rgba(31,37,64,0.62)'; g.fillRect(x, y, TW, TH);
    g.restore();
  }
  // "800" counts up as it lands
  const n = Math.round(800 * smooth(inv(TL.hookWord1, TL.hookWord1 + 0.75, t)));
  words([String(n)], 60, 640, 360, t, TL.hookWord1, TL.hookSwap - 0.3, PAPER, { track: -0.04 });
  words(['camp photos.'], 70, 820, 150, t, TL.hookWord2, TL.hookSwap - 0.3, PAPER, { accent: ['photos.'], accentColor: '#ff8fb5' });
  words(['Now sort', 'them.'], 70, 640, 190, t, TL.hookSwap, TL.reveal - 0.2, PAPER, { accent: ['them.'], accentColor: '#ff8fb5' });

  // page-pink circle opens from the middle into the brand shot
  const rv = spring(t - TL.reveal, 130, 24);
  if (rv > 0) {
    g.fillStyle = PAGE;
    g.beginPath(); g.arc(W / 2, H * 0.45, rv * 1400, 0, Math.PI * 2); g.fill();
  }
}

// 3-5 s: the brand. The mascot waves in; the wordmark and the promise follow.
function drawBrand(t) {
  g.fillStyle = PAGE; g.fillRect(0, 0, W, H);   // first after the hook: always on its own page
  g.save(); g.translate(0, -1900 * spring(t - (TL.scanIn - 0.2), ...SOFTS));
  mascot('cam-wave', W / 2, 760, 560, t, TL.logo - 0.22);   // lands on the impact
  const s2 = spring(t - TL.word, ...SNAPPY);
  g.save(); g.globalAlpha = clamp(s2 * 2); g.translate(0, (1 - s2) * 50);
  wordmark(W / 2, 1180, 120, ACCENT);
  g.restore();
  words(['Sort your album', 'any way you', 'can describe it.'], 120, 1410, 96, t, TL.tagline, null, INK, { accent: ['describe'] });
  g.restore();
}

// 5-7.5 s: scanning. The real card, the real stage names, and the mascot
// animated beside the progress, the way the app does it.
function scanArt(x, y, s, t) {
  // spot is the centre of the app's .scanart box (240x190 css, so 720x570 here)
  const bx = x + (SPOTS.scanart.x - 360) * s, by = y + (SPOTS.scanart.y - 285) * s;
  const stackX = bx + (720 - 210) * s, stackY = by + (570 - 18 - 162) * s;
  const cols = ['#fff1d6', '#e2f5ec', '#fde3ec'];
  [[-8, 0, 0], [5, -18, -24], [0, -42, -54]].forEach(([deg, dx, dy], i) => {
    g.save(); g.translate(stackX + (105 + dx) * s, stackY + (81 + dy) * s); g.rotate(deg * Math.PI / 180);
    shadow(12, 6, 0.12); rrect(-105 * s, -81 * s, 210 * s, 162 * s, 30 * s); g.fillStyle = cols[i]; g.fill(); noShadow();
    g.lineWidth = 9 * s; g.strokeStyle = PAPER; g.stroke(); g.restore();
  });
  const bob = -18 * s * (0.5 - 0.5 * Math.cos((t - TL.scanIn) * Math.PI * 2 / 2.4));
  g.drawImage(IMG['cam-search'], bx + 90 * s, by + 12 * s + bob, 540 * s, 540 * s);
  const beam = -210 * s * (0.5 + 0.5 * Math.cos((t - TL.scanIn) * Math.PI * 2 / 1.8));
  g.save(); g.globalAlpha = 0.55; g.fillStyle = ACCENT;
  rrect(bx + (720 + 12 - 258) * s, by + (570 - 12) * s + beam, 258 * s, 12 * s, 6 * s); g.fill(); g.restore();
}
function drawScan(t, bg = true) {
  if (bg) { g.fillStyle = PAGE; g.fillRect(0, 0, W, H); }
  caption(t, ['Every face found.', 'Every photo checked.'], TL.scanIn + 0.05, TL.cardIn - 0.35, ['face', 'photo']);
  const u = spring(t - TL.scanIn, ...SOFTS);
  const out = spring(t - (TL.cardIn - 0.25), ...SOFTS);
  const k = Math.min(8, Math.floor(9 * inv(TL.scanFrom, TL.scanTo, t)));
  const im = IMG['scan_' + k];
  const y = lerp(H + 50, APP_Y + 60, u) - out * 1900;
  const card = ui(im, PX, y, S, 40);
  scanArt(PX, y, S, t);
  // a small pulse on the step chip when a stage completes
  TL.stages.forEach((ts) => {
    const p = t - ts;
    if (p > 0 && p < 0.5) {
      g.save(); g.globalAlpha = 0.35 * (1 - p / 0.5); g.fillStyle = ACCENT;
      g.beginPath(); g.arc(W / 2, y + card.h * 0.86, 60 + p * 500, 0, Math.PI * 2); g.fill(); g.restore();
    }
  });
}

// 7.5-10 s: Everyone. Tick four faces; names appear; the card pans to row two.
function drawEveryone(t, bg = true) {
  if (bg) { g.fillStyle = PAGE; g.fillRect(0, 0, W, H); }
  caption(t, ['A folder for', 'each person.'], TL.cardIn + 0.1, TL.cullIn - 0.35, ['folder']);
  const k = TL.ticks.filter((x) => t >= x).length;
  const im = IMG['everyone_' + k];
  // a scroll view onto the card: row one, then it scrolls to row two
  const src = track(t, [[0, SPOTS.tick_0.y - 600], [TL.ticks[1] + 0.2, SPOTS.tick_2.y - 600]], ...SOFTS);
  const u = spring(t - TL.cardIn, ...SOFTS), out = spring(t - (TL.cullIn - 0.25), ...SOFTS);
  const top = APP_Y + 40 + (1 - u) * 1500 - out * 1900;
  ui(im, PX, top, S, 40, { sy: src, sh: (H - 90 - APP_Y - 40) / S });
  const pan = -src;
  // fingertip moves tick to tick on the beat
  if (t > TL.ticks[0] - 0.6 && t < TL.ticks[3] + 0.6) {
    let i = TL.ticks.findIndex((x) => t < x + 0.25); if (i < 0) i = 3;
    const pos = (j) => [PX + SPOTS['tick_' + j].x * S, top + (SPOTS['tick_' + j].y + pan) * S];
    const mv = spring(t - (TL.ticks[i] - 0.4), ...SNAPPY);
    const [ax, ay] = pos(Math.max(0, i - 1)), [bx, by] = pos(i);
    const x = i ? lerp(ax, bx, mv) : bx, y = i ? lerp(ay, by, mv) : by;
    const a = smooth(inv(TL.ticks[0] - 0.6, TL.ticks[0] - 0.3, t)) * (1 - smooth(inv(TL.ticks[3] + 0.25, TL.ticks[3] + 0.55, t)));
    finger(x, y + 16, TL.ticks[i], t, a);
  }
}

// 10-13.5 s: Cull. The Review pile; tap a photo, see why, exclude it.
function drawCull(t, bg = true) {
  if (bg) { g.fillStyle = PAGE; g.fillRect(0, 0, W, H); }
  const u = spring(t - TL.cullIn, ...SOFTS), out = spring(t - (TL.sortIn - 0.25), ...SOFTS);
  // show the card from the pile switcher down
  const SY = SPOTS.pileReview.y - 120;
  const top = APP_Y + 40 + (1 - u) * 1500 - out * 1900;
  const im = t >= TL.previewClose ? IMG.cull_1 : IMG.cull_0;
  g.save(); g.beginPath(); g.rect(0, APP_Y - 10, W, H); g.clip();
  ui(im, PX, top, S, 40, { sy: SY, sh: Math.min(im.height - SY, 1600 / S) });
  g.restore();
  const tile = SPOTS.tile0;
  const tx = PX + tile.x * S, ty = top + (tile.y - SY) * S;
  tapAt(tx, ty, TL.tapTile, t);

  // the preview grows out of the tile, and back into it
  const o = spring(t - TL.previewOpen, 200, 26) - spring(t - TL.previewClose, 220, 28);
  if (o > 0.002) {
    const pim = t >= TL.tapOut + 0.05 ? IMG.preview_1 : IMG.preview_0;
    g.save(); g.fillStyle = `rgba(31,37,64,${0.5 * clamp(o)})`; g.fillRect(0, 0, W, H); g.restore();
    const ps = 1000 / pim.width, pw = pim.width * ps, ph = pim.height * ps;
    const fx = (W - pw) / 2, fy = 520;
    // interpolate the dialog rect between the tile and its full place
    const tw = tile.w * S, sc = lerp(tw / pw, 1, o);
    const cx = lerp(tx, fx + pw / 2, o), cy = lerp(ty, fy + ph / 2, o);
    g.save(); g.globalAlpha = clamp(o * 2.5);
    g.translate(cx - pw * sc / 2, cy - ph * sc / 2); g.scale(sc, sc);
    ui(pim, 0, 0, ps, 40 / sc * sc);
    g.restore();
    if (o > 0.95) {
      const bx = fx + SPOTS.pOut.x * ps, by = fy + SPOTS.pOut.y * ps;
      tapAt(bx, by, TL.tapOut, t);
    }
  }
  // captions last, so the preview's backdrop never dims them
  caption(t, ['Keep the best.', 'Drop the misses.'], TL.cullIn + 0.1, TL.cap2 - 0.3, ['best.']);
  caption(t, ['See why.', 'Decide in one tap.'], TL.cap2, TL.sortIn - 0.35, ['why.']);
}

// 13.5-16 s: Sort by description. A Thai rule is typed; the folders appear.
function drawSort(t, bg = true) {
  if (bg) { g.fillStyle = PAGE; g.fillRect(0, 0, W, H); }
  caption(t, ['Describe it.', 'Gemini sorts it.'], TL.sortIn + 0.1, TL.barIn - 0.35, ['Gemini']);
  const u = spring(t - TL.sortIn, ...SOFTS);
  const k = Math.min(5, Math.floor(6 * inv(TL.typeFrom, TL.typeTo, t)));
  const form = IMG['sortform_' + k];
  // the folder rows only: skip the heading block of the panel
  const SY = 330;
  const fu = spring(t - TL.sortRes, ...SOFTS);
  const top = APP_Y + 40 + (1 - u) * 1500 - fu * 760;
  g.save(); g.beginPath(); g.rect(0, APP_Y - 10, W, H); g.clip();
  const f = ui(form, PX, top, S, 40, { sy: SY });
  tapAt(PX + SPOTS.runSort.x * S, top + (SPOTS.runSort.y - SY) * S, TL.tapSort, t);
  if (fu > 0.001) {
    const mim = IMG.sortmsg;
    const res = IMG.sortres;
    const ry = top + f.h + 30;
    g.save(); g.globalAlpha = clamp(fu * 2);
    ui(res, PX, ry + (1 - fu) * 200, S, 40);
    g.restore();
  }
  g.restore();
  // a small "Thai or English" badge next to the typing
  const bu = spring(t - TL.typeFrom - 0.3, ...BOUNCY) - spring(t - TL.tapSort, ...SNAPPY);
  if (bu > 0.01) {
    g.save(); g.globalAlpha = clamp(bu * 2);
    const bx = W - 420, by = top + 420 * S;
    g.translate(bx, by); g.scale(bu, bu); g.rotate(-0.05);
    shadow(20, 8, 0.15); rrect(0, -60, 340, 96, 48); g.fillStyle = INK; g.fill(); noShadow();
    g.font = `600 44px ${UI}`; g.fillStyle = PAPER; g.textAlign = 'center';
    g.fillText('ภาษาไทย ✓', 170, 4);
    g.restore(); g.textAlign = 'left';
  }
}

// 16-18 s: Export. The bar rises, the tap, the copy, the done card.
function drawExport(t, bg = true) {
  if (bg) { g.fillStyle = PAGE; g.fillRect(0, 0, W, H); }
  caption(t, ['Straight into', 'your Drive.'], TL.barIn + 0.1, TL.endIn - 0.3, ['Drive.']);
  // the sorted folders stay in view behind the bar
  const res = IMG.sortres;
  const back = spring(t - TL.done, ...SOFTS);
  g.save(); g.globalAlpha = 1 - 0.85 * back;
  ui(res, PX, APP_Y + 60, S, 40);
  g.restore();
  const bu = spring(t - TL.barIn, ...SOFTS);
  const ck = TL.copy.filter((x) => t >= x).length;
  const copying = t >= TL.exportTap + 0.2;
  const bim = copying ? IMG['copy_' + ck] : IMG.bar_0;
  const bs = 1040 / bim.width, bh = bim.height * bs;
  const by = H - 40 - bh * bu - (1 - bu) * 40;
  if (bu > 0.001 && back < 0.99) {
    g.save(); g.globalAlpha = 1 - back;
    ui(bim, (W - 1040) / 2, by + back * 300, bs, 40);
    g.restore();
    const ex = (W - 1040) / 2 + SPOTS.export.x * bs, ey = by + (copying ? (bim.height - IMG.bar_0.height) * bs : 0) + SPOTS.export.y * bs;
    tapAt(ex, ey, TL.exportTap, t);
  }
  if (back > 0.001) {
    const d = IMG.done, ds = 960 / d.width;
    const rows = TL.doneRows.filter((x) => t >= x).length;
    g.save(); g.globalAlpha = clamp(back * 2);
    const y = APP_Y + 80 + (1 - back) * 260;
    ui(d, (W - 960) / 2, y, ds * (0.94 + 0.06 * back), 40, rows < 2 ? { sh: d.height - (2 - rows) * 110 } : {});
    g.restore();
  }
}

// 18-20 s: lockup on accent, the mascot celebrating.
function drawEnd(t) {
  const u = spring(t - TL.endIn, 160, 26);
  const top = H * (1 - u);
  g.fillStyle = ACCENT; g.fillRect(0, top, W, H - top + 2);
  g.save(); g.translate(0, top * 0.35);
  mascot('cam-celebrate', W / 2, 560, 520, t, TL.endIn + 0.15);
  const s = spring(t - TL.endIn - 0.3, ...SNAPPY);
  g.save(); g.globalAlpha = clamp(s * 2); g.translate(0, (1 - s) * 40);
  wordmark(W / 2, 960, 112, PAPER);
  g.restore();
  words(['Sort your album', 'any way you can', 'describe it.'], 96, 1210, 100, t, TL.endLine, null, PAPER, { accent: ['describe'], accentColor: INK });
  const s3 = spring(t - TL.endSub, ...SNAPPY);
  g.globalAlpha = clamp(s3 * 2);
  g.font = `600 46px ${UI}`; g.textAlign = 'left'; g.fillStyle = '#ffe3ee';
  g.fillText('Google Drive · Gemini · Cloud Run', 100, 1610 + (1 - s3) * 30);
  g.restore();
}

// ================================================================== frame
// Each shot leaves upward while the next rises from below, both on the same
// page colour, so a handover draws the incoming shot without its background.
const SHOTS = [            // [start, draw, when it starts rising in]
  [TL.brand[0], drawBrand, TL.brand[0]],
  [TL.scan[0], drawScan, TL.scanIn - 0.2],
  [TL.everyone[0], drawEveryone, TL.cardIn - 0.25],
  [TL.cull[0], drawCull, TL.cullIn - 0.25],
  [TL.sort[0], drawSort, TL.sortIn - 0.25],
  [TL.exp[0], drawExport, TL.barIn - 0.25],
];
function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; noShadow();
  if (t < TL.brand[0]) drawHook(t);
  else {
    let i = 0;
    while (i + 1 < SHOTS.length && t >= SHOTS[i + 1][2]) i++;
    const [start, fn] = SHOTS[i];
    if (i > 0 && t < start + 0.7) { SHOTS[i - 1][1](t); fn(t, false); }   // handover
    else fn(t);
  }
  if (t >= TL.endIn) drawEnd(t);
}
window.seek = (t) => { draw(Math.max(0, Math.min(DUR - 1e-6, t))); return true; };

// live preview in a normal browser; off when rendering headless
window.ready.then(() => {
  if (navigator.webdriver) return;
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
});
</script>
<script src="assets/ui/manifest.js"></script>
